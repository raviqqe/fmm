license = "MIT"
authors = ["Yota Toyama <raviqqe@gmail.com>"]
edition = "2021"

[dependencies]
fmm = { path = "../fmm" }
fnv = "1"
inkwell = { version = "0.11.0", features = ["llvm23-1"] }
llvm-sys = "231.0.2"
once_cell = "1"
